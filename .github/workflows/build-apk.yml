name: Build BES QEMU Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: |
          unzip -o BES_QEMU_Android_Project_0.1.0.zip

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: BES_QEMU_Android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BES-QEMU-Android-APK
          path: BES_QEMU_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
